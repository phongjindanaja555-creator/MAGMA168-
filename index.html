<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASj"
    crossorigin="anonymous"
  >

  <title>แนะนำเพื่อนรับเครดิตฟรี&โค้ดฟรีสปิน อย่าพลาด!!</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- jQuery -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
</head>

<body>

  <!-- ส่วนหัวเว็บไซต์ -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">
        <img
          src="https://i.postimg.cc/L56gcjwp/6123080406144847969.jpg"
          alt="Logo"
          width="50"
          height="50"
        >
        &nbsp;&nbsp;&nbsp;MAGMA168 เว็บตรงอันดับ 1 ในไทย
      </span>
    </div>
  </nav>

  <!-- ส่วน Banner / ปุ่มแชร์ -->
  <div class="card text-center">
    <div class="card-header">
      <button type="button" id="ssdt" class="btn">
        <img
          src="https://i.postimg.cc/8PS06cvb/6188157510095671990.jpg"
          class="img-fluid"
          alt="โปรโมชั่น"
        >
      </button>
      <div class="card-footer text-muted">
        มีแอดมินบริการตลอด 24 ชม.
      </div>
    </div>
  </div>

  <script>
    window.onload = function (e) {
      // 1. เริ่มต้น LIFF ด้วย Promise Style
      liff.init({ liffId: "2011702007-axfVIXIJ" })
        .then(() => {
          // ตรวจสอบสถานะ Login
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }

          // ผูกอีเวนต์กดปุ่มแชร์
          var ss = document.getElementById("ssdt");
          ss.onclick = () => {
            
            // โครงสร้าง Flex Message ที่แก้ไขจุดผิดแล้ว
            var jk = [
              {
                "type": "flex",
                "altText": "รับเครดิตฟรี & โค้ดฟรีสปิน ง่ายๆ!",
                "contents": {
                  "type": "bubble",
                  "direction": "ltr",
                  "hero": {
                    "type": "image",
                    "url": "https://i.postimg.cc/hvr6jR2P/6190409309909357141.jpg",
                    "size": "full",
                    "aspectRatio": "1:1",
                    "aspectMode": "fit",
                    "backgroundColor": "#FFFFFFFF"
                  },
                  "body": {
                    "type": "box",
                    "layout": "vertical",
                    "backgroundColor": "#000000",
                    "contents": [
                      {
                        "type": "box",
                        "layout": "vertical",
                        "backgroundColor": "#FFFFFF",
                        "cornerRadius": "20px",
                        "contents": [
                          {
                            "type": "text",
                            "text": "MAGMA168",
                            "weight": "bold",
                            "size": "xxl",
                            "color": "#000000",
                            "align": "center",
                            "gravity": "center"
                          }
                        ]
                      },
                      {
                        "type": "box",
                        "layout": "vertical",
                        "margin": "lg",
                        "contents": [
                          {
                            "type": "text",
                            "text": "เเจกเครดิตฟรี & โค้ดฟรีสปิน เล่นง่าย",
                            "color": "#FFFFFF",
                            "align": "center",
                            "wrap": true
                          },
                          {
                            "type": "text",
                            "text": "จ่ายจริงถอนเงินสดได้จริง",
                            "color": "#FFFFFF",
                            "align": "center",
                            "gravity": "center"
                          }
                        ]
                      }
                    ]
                  },
                  "footer": {
                    "type": "box",
                    "layout": "horizontal",
                    "position": "relative",
                    "backgroundColor": "#330033",
                    "contents": [
                      {
                        "type": "button",
                        "action": {
                          "type": "uri",
                          "label": "สมัครสมาชิก",
                          "uri": "https://magma-168.ctmx.cc/?action=login&activeTab=deposit"
                        },
                        "color": "#CC0000",
                        "style": "primary",
                        "gravity": "center"
                      },
                      {
                        "type": "button",
                        "action": {
                          "type": "uri",
                          "label": "ติดต่อแอดมิน",
                          "uri": "https://lin.ee/WlS9qTh"
                        },
                        "color": "#00CC00",
                        "height": "md",
                        "style": "primary"
                      }
                    ]
                  },
                  // แก้ไขจุดนี้: ตัด separator ออกแล้วเก็บไว้เฉพาะ backgroundColor
                  "styles": {
                    "hero": {
                      "backgroundColor": "#000000"
                    },
                    "body": {
                      "backgroundColor": "#000000"
                    },
                    "footer": {
                      "backgroundColor": "#000000"
                    }
                  }
                }
              }
            ];

            // เรียกใช้งาน Share Target Picker
            shareflex(jk);
          };
        })
        .catch((err) => {
          alert("เกิดข้อผิดพลาดในการโหลด LIFF: " + err.message);
        });

function shareflex(flex) {
  // เรียกใช้งาน Share Target Picker โดยตรง
  liff.shareTargetPicker(flex)
    .then(function (res) {
      if (res) {
        // แชร์สำเร็จให้ปิดหน้าต่าง LIFF
        liff.closeWindow();
      }
    })
    .catch(function (error) {
      console.error("Share error:", error);
      alert("เกิดข้อผิดพลาด: " + error.message);
    });
}
    };
  </script>

  <!-- Bootstrap JavaScript -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"
  ></script>

</body>
</html>
